<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tech-Lux Shipping | Checkout</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #051424;
            color: #d4e4fa;
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-underline {
            position: relative;
        }
        .input-underline::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 1px;
            background-color: #4edea3;
            transition: width 0.3s ease;
        }
        .input-underline:focus-within::after {
            width: 100%;
        }
        @keyframes subtle-glow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }
        .glow-effect {
            animation: subtle-glow 4s infinite ease-in-out;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-lowest": "#010f1f",
                      "secondary-fixed-dim": "#bec6e0",
                      "primary": "#4edea3",
                      "surface-container-low": "#0d1c2d",
                      "secondary-container": "#3f465c",
                      "outline": "#86948a",
                      "secondary": "#bec6e0",
                      "on-tertiary-container": "#2e394c",
                      "error-container": "#93000a",
                      "on-tertiary": "#263143",
                      "surface-bright": "#2c3a4c",
                      "tertiary-fixed": "#d8e3fb",
                      "on-primary-fixed": "#002113",
                      "tertiary": "#bcc7de",
                      "surface-dim": "#051424",
                      "on-primary-fixed-variant": "#005236",
                      "primary-fixed-dim": "#4edea3",
                      "on-surface": "#d4e4fa",
                      "secondary-fixed": "#dae2fd",
                      "outline-variant": "#3c4a42",
                      "surface": "#051424",
                      "surface-container": "#122131",
                      "on-primary-container": "#00422b",
                      "primary-container": "#10b981",
                      "primary-fixed": "#6ffbbe",
                      "on-error-container": "#ffdad6",
                      "background": "#051424",
                      "on-secondary-container": "#adb4ce",
                      "tertiary-container": "#98a3ba",
                      "surface-tint": "#4edea3",
                      "surface-container-high": "#1c2b3c",
                      "on-surface-variant": "#bbcabf",
                      "error": "#ffb4ab",
                      "on-background": "#d4e4fa",
                      "on-error": "#690005",
                      "inverse-surface": "#d4e4fa",
                      "on-secondary": "#283044",
                      "surface-variant": "#273647",
                      "surface-container-highest": "#273647",
                      "on-tertiary-fixed": "#111c2d",
                      "inverse-primary": "#006c49",
                      "on-tertiary-fixed-variant": "#3c475a",
                      "on-primary": "#003824",
                      "on-secondary-fixed-variant": "#3f465c",
                      "inverse-on-surface": "#233143",
                      "on-secondary-fixed": "#131b2e",
                      "tertiary-fixed-dim": "#bcc7de"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "base": "8px",
                      "sm": "12px",
                      "xs": "4px",
                      "margin-mobile": "16px",
                      "md": "24px",
                      "xl": "80px",
                      "gutter": "24px",
                      "margin-desktop": "64px",
                      "lg": "48px"
              },
              "fontFamily": {
                      "headline-lg": ["Inter"],
                      "display-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "label-md": ["Inter"],
                      "label-sm": ["Inter"],
                      "headline-lg-mobile": ["Inter"]
              },
              "fontSize": {
                      "headline-lg": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "display-lg": ["64px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "label-sm": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "600"}],
                      "headline-lg-mobile": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}]
              }
            },
          },
        }
      </script>
</head>
<body class="bg-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/60 dark:bg-surface-dim/60 backdrop-blur-xl border-b border-white/10 shadow-sm flex items-center justify-between px-margin-mobile py-sm w-full">
<button class="text-primary active:scale-95 duration-200 hover:opacity-80 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-on-surface">Checkout</h1>
<div class="text-primary active:scale-95 duration-200 hover:opacity-80 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</div>
</header>
<main class="pt-24 px-margin-mobile space-y-xl">
<!-- Step Indicator -->
<div class="flex items-center gap-sm">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
</div>
<!-- Section: Shipping Identity -->
<section class="space-y-md">
<h2 class="font-headline-md text-headline-md-mobile text-on-surface">Recipient Details</h2>
<div class="space-y-lg">
<div class="input-underline border-b border-outline-variant/30 py-xs">
<label class="block text-label-sm text-on-surface-variant mb-xs">Full Name</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-on-surface placeholder:text-outline-variant/50" placeholder="Enter name" type="text"/>
</div>
<div class="input-underline border-b border-outline-variant/30 py-xs">
<label class="block text-label-sm text-on-surface-variant mb-xs">Contact Number</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-on-surface placeholder:text-outline-variant/50" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
</section>
<!-- Section: Address Autocomplete -->
<section class="space-y-md">
<div class="flex justify-between items-end">
<h2 class="font-headline-md text-headline-md-mobile text-on-surface">Shipping Address</h2>
<button class="text-primary text-label-sm flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="my_location">my_location</span>
                    Current Location
                </button>
</div>
<div class="relative">
<div class="flex items-center gap-sm glass-panel rounded-xl px-md py-sm border-primary/20">
<span class="material-symbols-outlined text-primary" data-icon="search">search</span>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full text-on-surface font-body-md" placeholder="Start typing address..." type="text"/>
</div>
<!-- Autocomplete Suggestion Mockup -->
<div class="mt-sm space-y-sm">
<div class="flex items-start gap-sm p-sm rounded-lg bg-surface-container-low border border-outline-variant/10 active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mt-xs" data-icon="location_on">location_on</span>
<div>
<p class="font-body-md text-on-surface">1200 Innovation Drive</p>
<p class="font-label-sm text-on-surface-variant">Silicon Valley, CA 94025</p>
</div>
</div>
</div>
</div>
</section>
<!-- Section: Delivery Methods -->
<section class="space-y-md">
<h2 class="font-headline-md text-headline-md-mobile text-on-surface">Delivery Method</h2>
<div class="space-y-sm">
<!-- Method 1 -->
<label class="relative block cursor-pointer group">
<input checked="" class="peer sr-only" name="delivery" type="radio"/>
<div class="glass-panel p-md rounded-xl flex items-center justify-between border border-transparent peer-checked:border-primary/50 transition-all duration-300">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="bolt">bolt</span>
</div>
<div>
<h3 class="font-body-md font-semibold text-on-surface">Priority Express</h3>
<p class="font-label-sm text-on-surface-variant">Next-day delivery by 10 AM</p>
</div>
</div>
<div class="text-right">
<p class="font-body-md font-bold text-primary">$24.99</p>
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
<!-- Method 2 -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="delivery" type="radio"/>
<div class="glass-panel p-md rounded-xl flex items-center justify-between border border-transparent peer-checked:border-primary/50 transition-all duration-300">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-lg bg-surface-container-highest flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="local_shipping">local_shipping</span>
</div>
<div>
<h3 class="font-body-md font-semibold text-on-surface">Standard Secure</h3>
<p class="font-label-sm text-on-surface-variant">Arrives in 3-5 business days</p>
</div>
</div>
<div class="text-right">
<p class="font-body-md font-bold text-on-surface">FREE</p>
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
</div>
</section>
<!-- Order Summary Glass Card -->
<section class="glass-panel p-md rounded-2xl space-y-sm mb-8">
<div class="flex justify-between font-label-md text-on-surface-variant">
<span>Items (3)</span>
<span>$2,499.00</span>
</div>
<div class="flex justify-between font-label-md text-on-surface-variant">
<span>Shipping</span>
<span id="shipping-cost">$24.99</span>
</div>
<div class="pt-sm border-t border-outline-variant/20 flex justify-between">
<span class="font-headline-md text-headline-md-mobile text-on-surface">Total</span>
<span class="font-headline-md text-headline-md-mobile text-primary">$2,523.99</span>
</div>
</section>
</main>
<!-- Bottom Navigation (Fixed Action) -->
<nav class="fixed bottom-0 left-0 w-full px-margin-mobile pb-8 pt-4 flex justify-between items-center bg-surface-container-highest/80 dark:bg-surface-container-lowest/80 backdrop-blur-2xl rounded-t-xl z-50 bg-surface-container-highest dark:bg-surface-container-low shadow-[0_-10px_40px_rgba(0,0,0,0.3)]">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-98 transition-transform">
<span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
<span class="font-label-md text-label-md">Cart</span>
</button>
<button class="flex flex-grow ml-md items-center justify-center bg-primary text-on-primary rounded-full px-lg py-sm shadow-[0_0_15px_rgba(78,222,163,0.4)] active:scale-95 transition-all font-bold gap-sm">
<span>Pay Now</span>
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
</button>
</nav>
<!-- Footer -->
<footer class="block w-full pb-xl border-t border-outline-variant/10 flex flex-col items-center gap-xs px-margin-mobile py-lg bg-surface-dim dark:bg-surface-container-lowest">
<p class="font-label-sm text-label-sm text-secondary">© 2024 TECH-LUX PRECISION. SECURE CHECKOUT.</p>
<div class="flex gap-md">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-all" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-all" href="#">Terms of Service</a>
</div>
</footer>
<script>
        // Micro-interactions for form focus
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('border-primary/50');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('border-primary/50');
            });
        });

        // Toggle shipping cost in summary based on radio selection
        const radios = document.querySelectorAll('input[name="delivery"]');
        const shippingCostText = document.getElementById('shipping-cost');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.checked) {
                    const price = e.target.closest('label').querySelector('p.text-primary, p.text-on-surface').innerText;
                    shippingCostText.innerText = price;
                }
            });
        });
    </script>
</body></html>
